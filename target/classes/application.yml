spring:
  datasource:
    url: jdbc:h2:mem:draftly;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

openai:
  api:
    url: https://api.openai.com/v1/chat/completions
    key: ${OPENAI_API_KEY:}

jwt:
  secret: ${JWT_SECRET:replace_this_with_strong_secret}
  expiration-minutes: 60

google:
  oauth2:
    client:
      id: ${GOOGLE_CLIENT_ID:}
      secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: http://localhost:8080/api/oauth/google/callback
      scope: https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send
